; Added to upstream programs.conf (php-fpm, queue-worker x2, scheduler).

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; Nightly upload of storage/app (logos, documents) to the backup bucket.
; Does nothing when no bucket is configured.
[program:files-backup]
command=/usr/local/bin/backup-files-loop
autostart=true
autorestart=true
user=www-data
environment=HOME="/var/www"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
